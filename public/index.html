<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkbox Grid</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================
   THEME VARIABLES
========================= */
:root {
  /* LIGHT */
  --bg: #effff5;
  --surface: rgba(255,255,255,0.6);
  --surface-strong: rgba(255,255,255,0.8);
  --ink: #102018;
  --muted: #547061;
  --accent: #22c55e;
  --line: rgba(34,197,94,0.22);
  --shadow: 0 28px 80px rgba(17,121,70,0.18);
}

html[data-theme="dark"] {
  /* DARK */
  --bg: #07130d;
  --surface: rgba(12,32,22,0.6);
  --surface-strong: rgba(14,38,26,0.8);
  --ink: #e6fff3;
  --muted: #8bbfa3;
  --accent: #22c55e;
  --line: rgba(34,197,94,0.22);
  --shadow: 0 30px 90px rgba(0,0,0,0.6);
}

/* =========================
   BASE
========================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 20% 20%, rgba(34,197,94,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(34,197,94,0.15), transparent 40%),
    var(--bg);
  padding: 40px 18px;
  transition: background 0.4s ease;
}

/* =========================
   TOGGLE BUTTON
========================= */
.theme-toggle {
  position: fixed;
  top: 18px;
  right: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  backdrop-filter: blur(14px);
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  color: var(--ink);
  box-shadow: var(--shadow);
  transition: 0.2s;
}

.theme-toggle:hover {
  transform: translateY(-2px);
}

/* =========================
   SHELL
========================= */
.shell {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 28px;
  border-radius: 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow);
}

/* =========================
   HEADER
========================= */
h1 {
  margin: 0;
  text-align: center;
  font-family: "DM Serif Display", serif;
  font-size: clamp(2.5rem, 5vw, 3.8rem);
}

.subtext {
  margin: 12px auto 28px;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  text-align: center;
  width: fit-content;
}

/* =========================
   GRID
========================= */
#container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(30px, 34px));
  gap: 14px;
  justify-content: center;
  padding: 26px;
  border-radius: 20px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
}

/* =========================
   CHECKBOX
========================= */
#container input {
  appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  transition: 0.2s;
}

#container input:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(34,197,94,0.3);
}

#container input:checked {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(34,197,94,0.5);
}

#container input:checked::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 12px;
  border: solid #022c22;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  left: 11px;
  top: 6px;
}

/* =========================
   TOAST
========================= */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--surface-strong);
  border: 1px solid var(--line);
  color: var(--ink);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  opacity: 0;
  transition: all 0.2s ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<!-- THEME TOGGLE -->
<button id="theme-toggle" class="theme-toggle">🌙</button>

<main class="shell">
  <h1>Checkbox Grid</h1>
  <div class="subtext">500 live connections</div>
  <div id="container"></div>
</main>

<div id="toast" class="toast"></div>

<!-- =========================
     ORIGINAL JS (UNCHANGED)
========================= -->
<script src="/socket.io/socket.io.js"></script>
<script>
const accessToken = localStorage.getItem("accessToken");
if (!accessToken) window.location.href = "/";

const container = document.getElementById('container');
const toast = document.getElementById('toast');
const socket = io();
const CHECKBOX_COUNT = 500;
let toastTimeout;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('is-visible');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('is-visible');
  }, 3000);
}

new Array(CHECKBOX_COUNT).fill(null).forEach((_, index) => {
  const input = document.createElement('input');
  input.id = `checkbox-${index}`;
  input.type = 'checkbox';

  input.addEventListener('change', (event) => {
    socket.emit("client:checkbox:change", {
      index,
      checked: event.target.checked,
      accessToken
    });
  });

  container.appendChild(input);
});

socket.on("server:checkbox:change", data => {
  document.querySelector(`#checkbox-${data.index}`).checked = data.checked;
});

socket.on("server:checkbox:user", data => {
  showToast(`${data.user} changed a checkbox.`);
});

socket.on("server:checkbox:status", data => {
  data.forEach((_, index) => {
    document.querySelector(`#checkbox-${index}`).checked = data[index];
  });
});

socket.on("server:error", error => {
  let checkbox = document.querySelector(`#checkbox-${error.data.index}`);
  checkbox.checked = !error.data.checked;
  showToast(error.message || "Something went wrong.");
});
</script>

<!-- =========================
     THEME TOGGLE SCRIPT
========================= -->
<script>
const toggle = document.getElementById("theme-toggle");
const saved = localStorage.getItem("theme");

if (saved) {
  document.documentElement.setAttribute("data-theme", saved);
  toggle.textContent = saved === "dark" ? "☀️" : "🌙";
}

toggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");

  if (current === "dark") {
    document.documentElement.setAttribute("data-theme", "light");
    localStorage.setItem("theme", "light");
    toggle.textContent = "🌙";
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    localStorage.setItem("theme", "dark");
    toggle.textContent = "☀️";
  }
});
</script>

</body>
</html>
